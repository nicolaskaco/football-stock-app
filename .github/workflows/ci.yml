name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # main todavía tiene errores de lint heredados: se muestran pero no bloquean
      # hasta que se limpien (después sacar continue-on-error).
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          # El build solo necesita que existan; la app real usa los valores de Vercel
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
